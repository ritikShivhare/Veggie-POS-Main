name: Aatmyam Marketing Preview Ping

on:
  schedule:
    # Every five minutes, offset from the busy start of the hour.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

# Only a public, read-only health request is needed.
permissions: {}

concurrency:
  group: aatmyam-marketing-preview-ping
  cancel-in-progress: false

jobs:
  ping-preview:
    # A fork must not keep pinging this restaurant testing service.
    if: github.repository == 'ritikShivhare/Veggie-POS-Main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Marketing Preview health
        env:
          PREVIEW_HEALTH_URL: https://aatmyam-marketing-preview.onrender.com/api/health
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          # Retry a cold start or temporary failure, with bounded request times.
          curl --fail --silent --show-error \
            --proto '=https' \
            --connect-timeout 10 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-max-time 190 --retry-all-errors \
            --output "$response_file" \
            "$PREVIEW_HEALTH_URL"

          # A Render loading/error page must not count as a healthy response.
          python3 - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as response:
                  health = json.load(response)
              if not isinstance(health, dict):
                  raise ValueError("The health response is not an object.")
              if health.get("status") != "ok" or health.get("database") != "connected":
                  raise ValueError("The application or database is not ready.")
          except (OSError, ValueError) as error:
              print(f"Preview health check failed: {error}", file=sys.stderr)
              sys.exit(1)

          print(f"Preview healthy; database connected; commit: {health.get('commit', 'unknown')}")
          PY
